[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foliotone"
version = "0.1.0"
description = "Analyze, identify, enrich, deduplicate, and later consolidate e-book and music collections."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
foliotone = "foliotone.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foliotone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/foliotone"]
