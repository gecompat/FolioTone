services:
  surface-api:
    profiles: ["local-surface"]
    build:
      context: .
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health').read()"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    volumes:
      - "${FOLIOTONE_DATA_DIR:-./data}:/data:rw"
      - "${FOLIOTONE_EBOOK_RENAME_DEPENDENCY_SCOPES_FILE:-./runtime/ebook-rename-dependency-scopes.json}:/run/foliotone/ebook-rename-dependency-scopes.json:ro"
    environment:
      FOLIOTONE_EBOOK_RENAME_DEPENDENCY_SCOPES_FILE: /run/foliotone/ebook-rename-dependency-scopes.json
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["surface-api", "--database", "/data/foliotone.db"]

  analysis-worker:
    profiles: ["local-surface"]
    depends_on:
      surface-api:
        condition: service_healthy
    build:
      context: .
    volumes:
      - "${FOLIOTONE_DATA_DIR:-./data}:/data:rw"
      - "${FOLIOTONE_EBOOKS_DIR:-./media/ebooks}:/media/ebooks:ro"
      - "${FOLIOTONE_MUSIC_DIR:-./media/music}:/media/music:ro"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["analysis-worker", "--database", "/data/foliotone.db"]

  operator-worker:
    profiles: ["local-surface"]
    depends_on:
      surface-api:
        condition: service_healthy
    build:
      context: .
    volumes:
      - "${FOLIOTONE_DATA_DIR:-./data}:/data:rw"
      - "${FOLIOTONE_EBOOK_RENAME_WRITABLE_ROOT:?set the exact authorized ScanRoot for this operator run}:/media/ebooks:rw"
      - "${FOLIOTONE_EBOOK_RENAME_CAPABILITIES_FILE:-./runtime/ebook-rename-capabilities.json}:/run/foliotone/ebook-rename-capabilities.json:ro"
      - "${FOLIOTONE_EBOOK_RENAME_DEPENDENCY_SCOPES_FILE:-./runtime/ebook-rename-dependency-scopes.json}:/run/foliotone/ebook-rename-dependency-scopes.json:ro"
    environment:
      FOLIOTONE_EBOOK_RENAME_CAPABILITIES_FILE: /run/foliotone/ebook-rename-capabilities.json
      FOLIOTONE_EBOOK_RENAME_DEPENDENCY_SCOPES_FILE: /run/foliotone/ebook-rename-dependency-scopes.json
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["operator-worker", "--database", "/data/foliotone.db"]

  foliotone:
    build:
      context: .
    volumes:
      - "${FOLIOTONE_DATA_DIR:-./data}:/data:rw"
      - "${FOLIOTONE_EBOOKS_DIR:-./media/ebooks}:/media/ebooks:ro"
      - "${FOLIOTONE_MUSIC_DIR:-./media/music}:/media/music:ro"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["status"]

  foliotone-ebook:
    profiles: ["ebook-tools"]
    platform: linux/amd64
    image: "${FOLIOTONE_EBOOK_TOOLCHAIN_IMAGE:-foliotone-ebook-tools:local}"
    build:
      context: .
      dockerfile: packaging/ebook-tools/Dockerfile
    volumes:
      - "${FOLIOTONE_DATA_DIR:-./data}:/data:rw"
      - "${FOLIOTONE_EBOOKS_DIR:-./media/ebooks}:/media/ebooks:ro"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["ebook-tools-doctor"]
