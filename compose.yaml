services:
  foliotone:
    build:
      context: .
    volumes:
      - "${FOLIOTONE_DATA_DIR:-./data}:/data:rw"
      - "${FOLIOTONE_EBOOKS_DIR:-./media/ebooks}:/media/ebooks:ro"
      - "${FOLIOTONE_MUSIC_DIR:-./media/music}:/media/music:ro"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["status"]
