services:
  surface-api:
    profiles: ["local-surface"]
    image: "${FOLIOTONE_IMAGE:-foliotone:local}"
    build:
      context: .
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health').read()"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    volumes:
      - type: bind
        source: "${FOLIOTONE_DATA_DIR:-./data}"
        target: /data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      [
        "surface-api",
        "--database",
        "/data/foliotone.db",
        "--container-loopback-publish",
      ]

  analysis-worker:
    profiles: ["local-surface"]
    image: "${FOLIOTONE_IMAGE:-foliotone:local}"
    depends_on:
      surface-api:
        condition: service_healthy
    build:
      context: .
    volumes:
      - type: bind
        source: "${FOLIOTONE_DATA_DIR:-./data}"
        target: /data
      - type: bind
        source: "${FOLIOTONE_EBOOKS_DIR:-./media/ebooks}"
        target: /media/ebooks
        read_only: true
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["analysis-worker", "--database", "/data/foliotone.db"]

  foliotone:
    image: "${FOLIOTONE_IMAGE:-foliotone:local}"
    build:
      context: .
    volumes:
      - type: bind
        source: "${FOLIOTONE_DATA_DIR:-./data}"
        target: /data
      - type: bind
        source: "${FOLIOTONE_EBOOKS_DIR:-./media/ebooks}"
        target: /media/ebooks
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["status"]

  foliotone-ebook:
    profiles: ["ebook-tools"]
    platform: linux/amd64
    image: "${FOLIOTONE_EBOOK_TOOLCHAIN_IMAGE:-foliotone-ebook-tools:local}"
    build:
      context: .
      dockerfile: packaging/ebook-tools/Dockerfile
    volumes:
      - type: bind
        source: "${FOLIOTONE_DATA_DIR:-./data}"
        target: /data
      - type: bind
        source: "${FOLIOTONE_EBOOKS_DIR:-./media/ebooks}"
        target: /media/ebooks
        read_only: true
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["ebook-tools-doctor"]
